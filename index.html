        var q = location.search;
        if (q.indexOf('normal=1') > -1) return;
        if (q.indexOf('retro=1') > -1) { location.replace('/retro/index2.htm'); return; }
        if (q.indexOf('handwritten=1') > -1) { location.replace('/handwritten/'); return; }

        if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) return;
        if (document.referrer.indexOf('/retro/') > -1) return;
        location.replace('/handwritten/');
      })();
